name: AI Service CI/CD  # GitHub Actions 워크플로우 이름


# main 브랜치에 push 또는 pull request가 발생하면 실행
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# 저장소 내용 읽기 권한만 허용
permissions:
  contents: read


jobs:

  # 테스트와 Docker 이미지 빌드를 수행하는 작업
  test-and-build:

    # GitHub에서 제공하는 Ubuntu 환경에서 실행
    runs-on: ubuntu-latest

    steps:

      # GitHub 저장소 코드를 실행 환경으로 가져오기
      - name: Checkout repository
        uses: actions/checkout@v7


      # Python 3.12 실행 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # pip 업그레이드 후 필요한 Python 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # train.py를 실행해 모델 학습 및 모델 파일 생성
      - name: Train model
        run: |
          python train.py


      # pytest를 실행해 FastAPI 테스트 수행
      - name: Run tests
        run: |
          python -m pytest


      # Dockerfile을 이용해 Docker 이미지 생성
      # github.sha는 현재 커밋의 고유 식별값
      - name: Build Docker image
        run: |
          docker build -t iris-api:${{ github.sha }} .

      # Docker Hub 로그인
      # main 브랜치에 실제 push된 경우에만 실행
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin


      # Docker Hub에 올릴 수 있도록 이미지 이름 변경
      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            iris-api:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/iris-api:latest


      # Docker Hub에 이미지 업로드
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/iris-api:latest