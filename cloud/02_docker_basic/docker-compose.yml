version: "3.9"  # Docker Compose 버전
# 실행할 컨테이너 명세
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "60080:8000"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=cloud_db
    restart: always
    
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - ./mysqldata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=cloud_db
    ports:
      - "63306:3306"